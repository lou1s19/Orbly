# CI for Orbly (Swift/SPM, native macOS app).
# macOS runners are billed at a 10x minute multiplier, so this is deliberate:
# main plus pull requests, nothing for documentation-only changes, and only ONE
# build run (release covers the typecheck as well).
name: CI

on:
  # main plus the branch prefixes actually in use. Documentation-only commits
  # trigger nothing.
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
    paths-ignore:
      - '**.md'
      - 'assets/**'
  # Pull requests from forks, so outside contributions get checked too.
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
  workflow_dispatch:

# A branch that is pushed and has an open pull request would otherwise run
# twice. Keep the newest run, cancel the older one.
#
# The key carries the head repository as well. Without it, a pull request from
# a fork whose branch happens to share a name with a branch here would cancel
# our run, and ours theirs.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15, not macos-14: its Swift 5.10 crashes the compiler with
    # "error: fatalError" (a toolchain crash, not a code error). The app is
    # built and shipped with the current toolchain anyway, and CI should use the
    # same compiler as the machine that releases. The deployment target stays
    # macOS 14 (Package.swift).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Tests
        run: swift test

      - name: Check shell scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done
